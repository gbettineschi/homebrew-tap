name: Update a released Mac app
on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      tag:
        type: string
        required: true
    secrets:
      TAP_DEPLOY_KEY:
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gbettineschi/homebrew-tap
          ref: main
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
      - name: Verify and publish the cask
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            # Every retry starts from the newest catalog and rechecks its version.
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/update-cask.py "$PACKAGE" "$TAG"
            git diff --check
            git add -- Casks/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update $PACKAGE to $TAG"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          echo 'Could not publish the tap after five attempts.' >&2
          exit 1
